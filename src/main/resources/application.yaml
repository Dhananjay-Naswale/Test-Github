spring:
  application:
    name: Order_Service
######################################

server:
port: 8082

datasource:
url: jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1
driver-class-name: org.h2.Driver
username: sa
password:
jpa:
hibernate:
ddl-auto: update
eureka:
client:
service-url:
defaultZone: http://localhost:8761/eureka/
resilience4j:
circuitbreaker:
configs:
default:
  registerHealthIndicator: true
  slidingWindowSize: 10
minimumNumberOfCalls: 5
failureRateThreshold: 50
instances:
productServiceCircuit:
base-config: default
slidingWindowSize: 20
failureRateThreshold: 30
retry:
instances:
productServiceRetry:
max-attempts: 3
wait-duration: 500ms
management:
endpoints:
web:
exposure:
include: "*"
springdoc:
api-docs:
path: /v3/api-docs